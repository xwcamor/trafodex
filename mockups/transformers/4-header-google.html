<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Index trafos · encabezado estilo Google</title>
<style>
  :root{--bg:#f4f6fb;--surface:#fff;--ink:#1f2329;--muted:#8a9099;--line:#e3e6ea;--pri:#0A6ED1;--alt:#f1f3f5;--vb:#1D7044;--vmal:#C8281D}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif}
  .wrap{max-width:1500px;margin:0 auto;padding:22px 26px 60px}
  /* header row */
  .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .ph h1{margin:0;font-size:26px;font-weight:800;display:flex;align-items:center;gap:12px}
  .ph .sq{width:40px;height:40px;border-radius:11px;background:var(--pri);display:flex;align-items:center;justify-content:center;color:#fff}
  .ph .cnt{font-size:13px;color:var(--muted);font-weight:500;margin-top:2px}
  .acts{display:inline-flex;gap:8px;flex-wrap:wrap}
  .btn{height:38px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:0 14px;font-size:13.5px;font-weight:600;color:#33405a;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
  .btn--ghost{color:var(--pri);border-color:#bcdcfa}
  .btn--pri{background:var(--pri);color:#fff;border-color:var(--pri)}

  /* HERO */
  .hero{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
  .bar{flex:1 1 460px;max-width:820px;display:flex;align-items:center;gap:10px;height:52px;padding:0 8px 0 20px;
    background:#fff;border:1px solid var(--line);border-radius:999px;box-shadow:0 1px 2px rgba(16,24,40,.04);transition:.18s}
  .bar:hover{box-shadow:0 2px 8px rgba(16,24,40,.10)}
  .bar:focus-within{border-color:transparent;box-shadow:0 3px 14px rgba(16,24,40,.16)}
  .bar .mag{font-size:18px;color:var(--muted)}
  .bar input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:17px;color:var(--ink)}
  .bar input::placeholder{color:#9aa0a6}
  .act{width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:#5f6b7a;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:17px}
  .act:hover{background:var(--alt);color:var(--ink)}
  .sep{width:1px;height:24px;background:var(--line)}
  .ctrls{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
  .vt{display:inline-flex;gap:2px;padding:3px;background:var(--alt);border:1px solid var(--line);border-radius:10px}
  .vt button{width:34px;height:30px;border:0;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;font-size:15px}
  .vt button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(16,24,40,.12)}

  /* conditions */
  .cond{display:flex;align-items:center;gap:8px;margin-bottom:18px}
  .addc{height:36px;border:1px dashed #c7ccd4;background:#fff;border-radius:9px;padding:0 14px;font-size:13.5px;color:#5f6b7a;display:inline-flex;align-items:center;gap:8px;cursor:pointer}

  /* a couple of result cards to show "antes de los resultados" boundary */
  .res{border-top:2px dashed #dfe3ea;padding-top:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:18px;margin-bottom:12px;border-left:5px solid var(--vb)}
  .card.bad{border-left-color:var(--vmal)}
  .nm{font-weight:700;font-size:16px}.cli{font-size:12px;color:var(--muted)}
  .bgs{display:flex;flex-wrap:wrap;gap:6px;flex:1}
  .bg{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#475467;background:#f3f5f7;border:1px solid var(--line);border-radius:7px;padding:3px 9px}
  .ring{width:56px;height:56px;border-radius:50%;border:5px solid var(--vb);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--vb)}
  .ring.bad{border-color:var(--vmal);color:var(--vmal)}
</style>
</head>
<body>
  <div class="wrap">
    <!-- fila 1: titulo + acciones -->
    <div class="ph">
      <div>
        <h1><span class="sq">⚡</span> Transformadores</h1>
        <div class="cnt">49 de 2425 registros</div>
      </div>
      <div class="acts">
        <button class="btn btn--ghost">📊 Panel de flota</button>
        <button class="btn">💾 Vistas · Por defecto ▾</button>
        <button class="btn">▦ Columnas (11/17)</button>
        <button class="btn">⬇ Exportar</button>
        <button class="btn">···</button>
        <button class="btn btn--pri">+ Crear transformador</button>
      </div>
    </div>

    <!-- fila 2: HERO barra grande -->
    <div class="hero">
      <label class="bar">
        <span class="mag">🔍</span>
        <input value="silicona" />
        <button class="act" title="Limpiar">✕</button>
        <span class="sep"></span>
        <button class="act" title="Búsqueda por voz">🎤</button>
      </label>
      <div class="ctrls">
        <button class="btn" style="height:40px">↕ Ordenar: Fecha de creación</button>
        <button class="btn" style="height:40px;width:40px;padding:0;justify-content:center">⇅</button>
        <button class="btn" style="height:40px;width:40px;padding:0;justify-content:center">☆</button>
        <div class="vt"><button>≣</button><button class="on">▦</button></div>
      </div>
    </div>

    <!-- fila 3: condiciones -->
    <div class="cond">
      <button class="addc">＋ Agregar condición</button>
    </div>

    <!-- frontera con resultados -->
    <div class="res">
      <div class="card bad">
        <div><div class="nm">13371160</div><div class="cli">SOUTHERN PERU COPPER CORP…</div></div>
        <div class="bgs"><span class="bg">Distribución</span><span class="bg">WEG</span><span class="bg">Silicona</span><span class="bg">13.80 kV</span><span class="bg">2.50 MVA</span><span class="bg">2011</span></div>
        <div class="ring bad">19</div>
      </div>
      <div class="card">
        <div><div class="nm">L701052-01</div><div class="cli">SOUTHERN PERU COPPER CORP…</div></div>
        <div class="bgs"><span class="bg">Potencia</span><span class="bg">ABB</span><span class="bg">Silicona</span><span class="bg">DETC</span><span class="bg">Tanque sellado N₂</span><span class="bg">4.16 kV</span></div>
        <div class="ring">81</div>
      </div>
    </div>
  </div>
</body>
</html>
