<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TR APP · Matriz de Riesgo (Mockup 2)</title>
<style>
  :root{
    --bg:#f4f6fb; --panel:#fff; --ink:#0f1b2d; --muted:#6b7990; --line:#e5e9f2;
    --vb:#16a34a; --b:#65a30d; --med:#f59e0b; --mal:#ea580c; --vmal:#dc2626;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1320px;margin:0 auto;padding:22px 26px 60px}
  .top{display:flex;align-items:center;gap:16px;margin-bottom:20px}
  .brand{font-weight:800;letter-spacing:-.2px;font-size:18px}
  .brand small{color:var(--muted);font-weight:600;font-size:12px;margin-left:6px}
  .search{flex:1;max-width:440px;position:relative}
  .search input{width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;
       padding:11px 14px 11px 38px;font-size:14px;outline:none;box-shadow:0 1px 2px #0f1b2d0a}
  .search svg{position:absolute;left:12px;top:11px}
  .seg{display:flex;background:#eef1f8;border-radius:10px;padding:3px}
  .seg button{border:0;background:transparent;padding:7px 13px;border-radius:8px;font-size:13px;color:var(--muted);cursor:pointer;font-weight:600}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0f1b2d14}

  .layout{display:grid;grid-template-columns:1fr 320px;gap:18px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 3px #0f1b2d08}

  /* Matrix */
  .mtitle{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px}
  .mtitle h3{margin:0;font-size:16px}
  .mtitle p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
  .matrix{padding:8px 20px 20px}
  .axis-x{display:grid;grid-template-columns:64px repeat(5,1fr);font-size:11px;color:var(--muted);font-weight:600;text-align:center;margin-bottom:4px}
  .mrow{display:grid;grid-template-columns:64px repeat(5,1fr);gap:8px;margin-bottom:8px}
  .ylab{display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:11px;color:var(--muted);font-weight:700;text-align:right}
  .cell{position:relative;min-height:78px;border-radius:12px;border:1px solid var(--line);background:#fbfcfe;
        display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;padding:8px}
  .cell.hot{background:#fef2f2;border-color:#fecaca}
  .cell.warm{background:#fff7ed;border-color:#fed7aa}
  .cell.mid{background:#fffbeb;border-color:#fde68a}
  .cell.cool{background:#f0fdf4;border-color:#bbf7d0}
  .bub{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
       color:#fff;font-size:10px;font-weight:800;cursor:pointer;box-shadow:0 2px 6px #0003;transition:.15s transform}
  .bub:hover{transform:scale(1.18)}
  .bub.lg{width:34px;height:34px;font-size:11px}
  .cap{font-size:10px;color:var(--muted);margin-top:2px}

  /* Watchlist */
  .wl h3{margin:0;padding:18px 18px 2px;font-size:15px}
  .wl p{margin:0;padding:0 18px 12px;font-size:12px;color:var(--muted)}
  .item{display:flex;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);cursor:pointer;transition:.12s background}
  .item:hover{background:#f8faff}
  .ring{width:40px;height:40px;flex:none;position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
  .it-main{flex:1;min-width:0}
  .it-main .s{font-weight:700;font-size:13.5px}
  .it-main .c{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it-r{text-align:right}
  .it-r .f{font-size:11px;font-weight:700}
  .it-r .k{font-size:11px;color:var(--muted)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:0 20px 16px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:10px;height:10px;border-radius:50%;display:inline-block}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">TR APP <small>Matriz de Riesgo de Flota</small></div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7990" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input placeholder="Buscar serie, TAG, cliente, marca…">
    </div>
    <div class="seg"><button class="on">Matriz</button><button>Mapa</button><button>Lista</button></div>
  </div>

  <div class="layout">
    <!-- MATRIX -->
    <div class="panel">
      <div class="mtitle">
        <div>
          <h3>Condición × Clase de tensión</h3>
          <p>Cada burbuja = un trafo · tamaño = potencia (MVA) · color = índice de salud</p>
        </div>
      </div>
      <div class="matrix" id="matrix"></div>
      <div class="legend">
        <span><i class="sw" style="background:var(--vb)"></i>Muy Bueno</span>
        <span><i class="sw" style="background:var(--b)"></i>Bueno</span>
        <span><i class="sw" style="background:var(--med)"></i>Medio</span>
        <span><i class="sw" style="background:var(--mal)"></i>Malo</span>
        <span><i class="sw" style="background:var(--vmal)"></i>Muy Malo</span>
      </div>
    </div>

    <!-- WATCHLIST -->
    <div class="panel wl">
      <h3>Watchlist crítica</h3>
      <p>Acción prioritaria · ordenado por riesgo</p>
      <div id="wl"></div>
    </div>
  </div>
</div>

<script>
  const C={vb:'#16a34a',b:'#65a30d',med:'#f59e0b',mal:'#ea580c',vmal:'#dc2626'};
  function condColor(hi){ if(hi>85)return C.vb; if(hi>70)return C.b; if(hi>50)return C.med; if(hi>30)return C.mal; return C.vmal; }
  function condName(hi){ if(hi>85)return'Muy Bueno'; if(hi>70)return'Bueno'; if(hi>50)return'Medio'; if(hi>30)return'Malo'; return'Muy Malo'; }
  // columnas = condición (de peor a mejor IEEE C57.104), filas = clase de tensión
  const cols=['Muy Malo','Malo','Medio','Bueno','Muy Bueno'];
  const cellClass=['hot','warm','mid','cool','cool'];
  const rows=['≥220 kV','60–138 kV','≤33 kV'];
  const data=[
    {serie:'TR-0801',cli:'PLUZ Energía',hi:34,mva:120,vclass:0,fault:'T2 alta'},
    {serie:'TR-0712',cli:'Engie',hi:88,mva:333,vclass:0,fault:'Normal'},
    {serie:'TR-0335',cli:'Statkraft',hi:91,mva:90,vclass:1,fault:'Normal'},
    {serie:'TR-1555',cli:'Hidrandina',hi:49,mva:25,vclass:1,fault:'DT mixta'},
    {serie:'TR-1042',cli:'Enel',hi:78,mva:40,vclass:1,fault:'PD'},
    {serie:'TR-2207',cli:'Aceros Arequipa',hi:22,mva:15,vclass:2,fault:'D2 arco'},
    {serie:'TR-1890',cli:'Luz del Sur',hi:64,mva:10,vclass:2,fault:'T1 baja'},
    {serie:'TR-2901',cli:'Sider Perú',hi:71,mva:18,vclass:2,fault:'Normal'},
  ];
  function colIndex(hi){const n=condName(hi);return cols.indexOf(n);}

  // build matrix
  const m=document.getElementById('matrix');
  let html='<div class="axis-x"><span></span>'+cols.map(c=>`<span>${c}</span>`).join('')+'</div>';
  rows.forEach((r,ri)=>{
    html+=`<div class="mrow"><div class="ylab">${r}</div>`;
    cols.forEach((c,ci)=>{
      const here=data.filter(d=>d.vclass===ri && colIndex(d.hi)===ci);
      const bubs=here.map(d=>{
        const big = d.mva>=120?' lg':'';
        return `<div class="bub${big}" title="${d.serie} · ${d.cli} · HI ${d.hi}" style="background:${condColor(d.hi)}">${d.hi}</div>`;
      }).join('');
      html+=`<div class="cell ${cellClass[ci]}">${bubs}</div>`;
    });
    html+='</div>';
  });
  m.innerHTML=html;

  // watchlist (sorted asc by HI)
  const wl=document.getElementById('wl');
  const circ=2*Math.PI*16;
  [...data].sort((a,b)=>a.hi-b.hi).slice(0,5).forEach(d=>{
    const col=condColor(d.hi), dash=(d.hi/100*circ).toFixed(1);
    wl.insertAdjacentHTML('beforeend',`
      <div class="item">
        <div class="ring">
          <svg width="40" height="40"><circle cx="20" cy="20" r="16" fill="none" stroke="#eef1f8" stroke-width="5"/>
          <circle cx="20" cy="20" r="16" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${dash} ${circ}"/></svg>
          <b style="color:${col}">${d.hi}</b>
        </div>
        <div class="it-main">
          <div class="s">${d.serie}</div>
          <div class="c">${d.cli}</div>
        </div>
        <div class="it-r">
          <div class="f" style="color:${col}">${condName(d.hi)}</div>
          <div class="k">${d.fault}</div>
        </div>
      </div>`);
  });
</script>
</body>
</html>
